<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FDB 知識出貨站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<style>
:root{
  --paper:#EDEFEA; --card:#FAFAF7; --ink:#1E2A2F; --ink-soft:#56636A; --line:#CBD0C8;
  --kraft:#B9925A; --kraft-soft:#EADBC0; --tape:#F2C21B; --ok:#2F7A55; --ok-soft:#DCEBE2;
  --warn:#B8452E; --warn-soft:#F5DDD6;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow","Noto Sans TC",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141819; --card:#1D2326; --ink:#E6E9E4; --ink-soft:#A1ABA8; --line:#343B3E;
    --kraft:#C9A46C; --kraft-soft:#3A3125; --tape:#E8B915; --ok:#5FB487; --ok-soft:#1F3328;
    --warn:#E07A5F; --warn-soft:#3A2420;
  }
}
:root[data-theme="dark"]{
  --paper:#141819; --card:#1D2326; --ink:#E6E9E4; --ink-soft:#A1ABA8; --line:#343B3E;
  --kraft:#C9A46C; --kraft-soft:#3A3125; --tape:#E8B915; --ok:#5FB487; --ok-soft:#1F3328;
  --warn:#E07A5F; --warn-soft:#3A2420;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
.tape{height:10px;background:repeating-linear-gradient(-45deg,var(--tape) 0 14px,var(--ink) 14px 28px)}
header.top{max-width:820px;margin:0 auto;padding:20px 20px 0}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:26px;font-weight:900;margin:0;letter-spacing:.02em}
.brand span{color:var(--ink-soft);font-size:14px}
/* station lane: the one bold element */
.lane-wrap{overflow-x:auto;margin:18px -20px 0;padding:0 20px 6px}
.lane{display:flex;min-width:640px;position:relative;padding:8px 0 4px}
.lane::before{content:"";position:absolute;left:18px;right:18px;top:27px;height:4px;background:var(--line);border-radius:2px}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;background:none;border:0;color:inherit;font:inherit;padding:0;cursor:default}
.st .dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:18px;background:var(--card);border:3px solid var(--line);color:var(--ink-soft);z-index:1}
.st .lbl{font-size:13px;color:var(--ink-soft);white-space:nowrap}
.st.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.st.done{cursor:pointer}
.st.cur .dot{background:var(--tape);border-color:var(--ink);color:#1E2A2F}
.st.cur .lbl{color:var(--ink);font-weight:700}
.st.done:hover .lbl,.st.done:focus-visible .lbl{text-decoration:underline}
main{max-width:820px;margin:0 auto;padding:16px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:28px 28px 24px;margin-top:8px}
.card h2{font-size:24px;font-weight:900;margin:0 0 4px;line-height:1.4}
.card .sub{color:var(--ink-soft);margin:0 0 20px}
.code{font-family:var(--cond);font-weight:700;color:var(--kraft);font-size:18px;letter-spacing:.04em}
h3{font-size:17px;margin:24px 0 8px}
p{margin:0 0 12px}
.slip{border-left:6px solid var(--kraft);background:var(--kraft-soft);padding:14px 18px;border-radius:0 4px 4px 0;margin:12px 0 18px}
.slip b{display:block;margin-bottom:2px}
.slip .muted{color:var(--ink-soft);font-size:14px}
.q{font-size:18px;font-weight:700;margin:6px 0 10px;line-height:1.6}
.hint{color:var(--ink-soft);font-size:14px;margin:-4px 0 12px}
label.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:4px;margin-bottom:10px;cursor:pointer;background:var(--paper)}
label.chk input{width:20px;height:20px;margin-top:4px;flex:none;accent-color:var(--ok)}
select,input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:4px;padding:10px 12px}
textarea{min-height:180px;resize:vertical;line-height:1.7}
select:focus,input:focus,textarea:focus{outline:3px solid var(--tape);outline-offset:1px;border-color:var(--ink)}
.meta{display:flex;justify-content:space-between;color:var(--ink-soft);font-size:13px;margin-top:6px;gap:8px;flex-wrap:wrap}
.meta .bad{color:var(--warn);font-weight:700}
.meta .good{color:var(--ok);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}
button.btn{font:inherit;font-weight:700;border-radius:4px;padding:11px 20px;cursor:pointer;border:2px solid var(--ink);background:var(--ink);color:var(--paper)}
button.btn.ghost{background:transparent;color:var(--ink)}
button.btn.small{padding:6px 12px;font-size:14px}
button.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,.st:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.msg{border-radius:4px;padding:14px 16px;margin-top:16px;font-size:15px}
.msg.ok{background:var(--ok-soft);border-left:5px solid var(--ok)}
.msg.warn{background:var(--warn-soft);border-left:5px solid var(--warn)}
.msg.info{background:var(--paper);border-left:5px solid var(--kraft)}
.msg b{display:block;margin-bottom:2px}
.ask{margin-top:8px;font-weight:700}
.thinking{color:var(--ink-soft);font-style:normal}
.thinking::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"．"}50%{content:"．．"}75%{content:"．．．"}}
.slides{display:grid;gap:10px;margin-top:10px}
.sl{border:1px solid var(--line);border-radius:4px;padding:12px 16px;background:var(--paper)}
.sl .h{font-weight:700}
.sl ul{margin:6px 0 0;padding-left:1.2em}
.bars{display:grid;gap:10px;margin:14px 0}
.bar{display:grid;grid-template-columns:7.5em 1fr 4em;gap:10px;align-items:center;font-size:14px}
.bar .track{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--ok)}
.bar .fill.low{background:var(--warn)}
.total{font-family:var(--cond);font-size:56px;font-weight:700;line-height:1}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{counter-increment:s;position:relative;padding:4px 0 8px 40px}
.steps li::before{content:counter(s);position:absolute;left:0;top:4px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--cond);font-weight:700}
pre.prompt{white-space:pre-wrap;background:var(--paper);border:1px dashed var(--kraft);padding:14px;border-radius:4px;font-family:var(--sans);font-size:14px;margin:8px 0}
.files{display:grid;gap:6px;font-size:15px}
.files code{background:var(--paper);padding:2px 8px;border-radius:3px;word-break:break-all;font-family:var(--sans)}
.scene{border:1px solid var(--line);border-radius:4px;background:var(--paper);padding:14px 16px}
.scene .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700}
.scene .vis{color:var(--ink-soft);font-size:14px;margin:4px 0 8px}
.scene textarea{min-height:110px;background:var(--card)}
.scene .kp{font-size:14px;margin-top:8px}
.scene .kp span{display:inline-block;background:var(--kraft-soft);border-radius:3px;padding:1px 8px;margin:2px 4px 2px 0}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--ink);margin-top:8px}
.tabs button{font:inherit;font-weight:700;background:transparent;border:2px solid var(--ink);border-bottom:0;color:var(--ink);padding:9px 16px;cursor:pointer;border-radius:4px 4px 0 0;margin-right:-2px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tabs button .tag{font-size:12px;font-weight:500;margin-left:6px;background:var(--tape);color:#1E2A2F;border-radius:3px;padding:0 6px}
.tabpanel{border:2px solid var(--ink);border-top:0;padding:16px 18px;border-radius:0 0 4px 4px}
.locked{opacity:.45;pointer-events:none}
footer{max-width:820px;margin:0 auto;padding:0 20px 40px;color:var(--ink-soft);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer button{background:none;border:0;color:var(--ink-soft);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
@media (max-width:560px){.card{padding:20px 16px}.card h2{font-size:21px}.bar{grid-template-columns:6.5em 1fr 3.5em}}
@media (prefers-reduced-motion:reduce){.thinking::after{animation:none;content:"…"}}
</style>
</head>
<body>
<div class="tape" aria-hidden="true"></div>
<header class="top">
  <div class="brand"><h1>FDB 知識出貨站</h1><span>一站一站走完，你的教材就打包好了</span></div>
  <div class="lane-wrap"><nav class="lane" id="lane" aria-label="進度"></nav></div>
</header>
<main id="app"></main>
<footer>

<script>

/* ============================================================
   敏感資料偵測（依公司資訊安全守則：機密性、個資保護）
   ============================================================ */
const SENS=[
  {re:/(NT\$?|新台幣|\$)\s*\d[\d,\.]*/gi,why:"金額"},
  {re:/\d[\d,]*(\.\d+)?\s*(元|塊|萬元|萬)/g,why:"金額"},
  {re:/09\d{2}[-\s]?\d{3}[-\s]?\d{3}/g,why:"手機號碼"},
  {re:/[\w.+-]+@[\w-]+\.[\w.]+/g,why:"Email"},
  {re:/\b[A-Z][12]\d{8}\b/g,why:"身分證字號"},
  {re:/(密碼|password|帳密|單價|報價|折扣率)/gi,why:"帳密或報價相關字詞"}
];
function scanSens(t){const hits=[];SENS.forEach(s=>{const m=t.match(s.re);if(m)m.forEach(x=>hits.push({x:x.trim(),why:s.why}));});
  const seen=new Set();return hits.filter(h=>{const k=h.x+h.why;if(seen.has(k))return false;seen.add(k);return true;}).slice(0,6);}

const lines=t=>t.split(/\n+/).map(x=>x.replace(/^\s*([0-9０-９]+[\.．、)]|[-•●☐□✓]\s*)/,"").trim()).filter(Boolean);
const chars=t=>t.replace(/\s/g,"").length;

function localCheck(i){
  const r=SECTIONS[i].rule,t=S.sec[i].text,c=chars(t),l=lines(t).length,out=[];
  if(r.minChars&&c<r.minChars)out.push(`再多寫一點（目前 ${c} 字，至少 ${r.minChars} 字）`);
  if(r.minLines&&l<r.minLines)out.push(`至少要 ${r.minLines} 行（目前 ${l} 行）`);
  if(r.maxLines&&l>r.maxLines)out.push(`最多 ${r.maxLines} 行（目前 ${l} 行），請合併或刪減`);
  return out;
}

  <select id="who" aria-label="選擇你的名字"><option value="">選擇你的名字</option>${opts}<option value="other" ${S.person==="other"?"selected":""}>名單上沒有我</option></select>
  ${body}
  </section>`;
}

/* ---------- 第 3–7 站：五段內容 ---------- */
function vSection(i){
  const s=SECTIONS[i], st=S.sec[i], p=me();
  const outline = (p && !S.topic.changed) ? p[5][i] : "";
  return `<section class="card">
  <div class="code">第 ${i+3} 站／共 10 站</div>
  <h2>${s.title}</h2>
  <p class="sub">主題：${esc(S.topic.title)}</p>
  ${outline?`<div class="slip"><b>你的建議書這一段寫的方向</b>${esc(outline)}</div>`:""}
  <p class="q">${s.q}</p>
  <p class="hint">${s.hint}</p>
  <textarea id="ta" aria-label="${s.title}">${esc(st.text)}</textarea>
  <div class="meta" id="meta"></div>
  <div id="sensBox"></div>
  <div id="rvBox" aria-live="polite"></div>
  <div class="row" id="btns"></div>
  </section>`;
}
function sectionDyn(i){
  const s=SECTIONS[i], st=S.sec[i], lc=localCheck(i), c=chars(st.text), l=lines(st.text).length;
  const ruleTxt=[s.rule.minChars?`${c} 字`:"", (s.rule.minLines||s.rule.maxLines)?`${l} 行`:""].filter(Boolean).join("／");
  $("#meta").innerHTML=`<span>${ruleTxt}</span><span class="${lc.length?"bad":"good"}">${lc.length?lc.join("；"):"基本檢查通過"}</span>`;
  const sens=scanSens(st.text), sensBlock=sens.length>0&&!st.sensOk;
  const sb=$("#sensBox");
  const sensKey=sens.map(h=>h.x).join("|")+(st.sensOk?"#ok":"");
  if(sb.dataset.k!==sensKey){
    sb.dataset.k=sensKey;
    sb.innerHTML = sens.length && !st.sensOk ? `<div class="msg warn"><b>安檢提醒：可能有機密資料</b>偵測到：${sens.map(h=>`「${esc(h.x)}」(${h.why})`).join("、")}。<br>請改寫成「某金額」「客戶 A」等說法。如果這是示意用的虛構數字，請勾選：
     <label class="chk" style="margin:10px 0 0"><input type="checkbox" id="sensOk"><span>我確認這不是真實的機密資料</span></label></div>`:"";
    const so=$("#sensOk"); if(so)so.onchange=e=>{st.sensOk=e.target.checked;save();sectionDyn(i);};
  }
  const rv=st.review;
  let h="";
  if(rv&&rv.pending)h=`<div class="msg info"><span class="thinking">品檢員正在看</span></div>`;
  else if(rv&&rv.err)h=`<div class="msg warn">${esc(rv.err)}</div>`;
  else if(rv&&rv.pass)h=`<div class="msg ok"><b>通過品檢</b>${esc(rv.feedback)}</div>`;
  else if(rv)h=`<div class="msg warn"><b>還差一點</b>${esc(rv.feedback)}${rv.question?`<div class="ask">追問：${esc(rv.question)}</div><p class="hint" style="margin:6px 0 0">直接在上方輸入框補充，再送一次。</p>`:""}</div>`;
  $("#rvBox").innerHTML=h;
  const passed = st.status==="pass"||st.status==="soft";
  const canSoft = !passed && rv && !rv.pass && !rv.pending && !rv.err && st.rounds>=CONFIG.maxAiRounds;
  const block = lc.length>0 || sensBlock;
  $("#btns").innerHTML = `<button class="btn ghost" id="prev">上一站</button>` + (passed
      ? `<button class="btn" id="next">前往下一站</button>`
      : aiOff
        ? `<button class="btn" id="passLocal" ${block?"disabled":""}>這段完成，前往下一站</button>`
        : `<button class="btn" id="review" ${block||(rv&&rv.pending)?"disabled":""}>送品檢</button>
           ${canSoft?`<button class="btn ghost" id="soft">先放行，之後再回來補</button>`:""}`);
  const on=(sel,fn)=>{const el=$(sel);if(el)el.onclick=fn;};
  on("#prev",()=>go(S.step-1));
  on("#review",()=>reviewSection(i));
  on("#soft",()=>{st.status="soft";go(S.step+1);});
  on("#passLocal",()=>{st.status="pass";go(S.step+1);});
  on("#next",()=>go(S.step+1));
}

/* ---------- 第 8 站：打包 ---------- */
const RATE=220; // 中文旁白每分鐘約 220 字
const narrChars=()=>(S.scenes||[]).reduce((a,x)=>a+chars(x.narration||""),0);
function durHtml(){const n=narrChars(),est=Math.round(n/RATE*10)/10;
  return `<span>旁白共 ${n} 字</span><span class="${est>10?"bad":"good"}">預估影片 ${est} 分鐘${est>10?"，超過 10 分鐘，請刪減旁白":""}</span>`;}

    :`<div class="msg warn"><b>影片會超過 10 分鐘</b>可以自己刪減上方旁白，或讓 AI 幫你精簡（必講重點會保留）。

}

const CRIT=[["主題契合度",15],["教材完整性",20],["內容正確度",20],["影片品質",15],["實務性",15],["自學可用性",15]];

/* ============================================================
   事件
   ============================================================ */
function bind(id){
  const on=(sel,ev,fn)=>{const el=$(sel);if(el)el[ev]=fn;};
  on("#prev","onclick",()=>go(S.step-1));
  if(id==="sec"){
    document.querySelectorAll("[data-ack]").forEach(c=>c.onchange=()=>{S.ack[+c.dataset.ack]=c.checked;save();$("#next").disabled=!S.ack.every(Boolean);});
    on("#next","onclick",()=>go(1));
  }
  if(id==="topic"){
    on("#who","onchange",e=>{S.person=e.target.value;const p=me();
      S.topic=p?{module:p[2],official:p[3],title:p[4],changed:false,checked:false,feedback:null}:{module:"",official:"",title:"",changed:true,checked:false,feedback:null};
      save();render();});
    on("#nm","oninput",e=>{S.name=e.target.value.trim();save();});
    on("#un","oninput",e=>{S.unit=e.target.value.trim();save();});
    on("#useSug","onclick",()=>{S.topic.changed=false;go(2);});
    on("#chg","onclick",()=>{S.topic.changed=true;S.topic.feedback=null;save();render();});
    on("#backSug","onclick",()=>{const p=me();S.topic={module:p[2],official:p[3],title:p[4],changed:false,checked:false,feedback:null};save();render();});
    on("#mod","onchange",e=>{S.topic.module=e.target.value;S.topic.official="";S.topic.feedback=null;save();render();});
    on("#off","onchange",e=>{S.topic.official=e.target.value;S.topic.feedback=null;save();});
    on("#tt","oninput",e=>{S.topic.title=e.target.value.trim();S.topic.feedback=null;save();});
    on("#useAiTitle","onclick",()=>{S.topic.title=S.topic.feedback.suggestion;S.topic.feedback={ok:true,feedback:"已套用建議題目。"};save();render();});
    on("#chkTopic","onclick",checkTopic);
    on("#confirmTopic","onclick",()=>{
      const T=S.topic,errs=[];
      if(S.person==="other"&&(!S.name||!S.unit))errs.push("請填姓名與單位");
      if(!T.module||!T.official)errs.push("請選模組與官方主題");
      if(chars(T.title)<6)errs.push("主題請寫具體一點（至少 6 個字）");
      if(errs.length){$("#tmsg").innerHTML=`<div class="msg warn">${errs.join("；")}</div>`;return;}
      go(2);});
  }
  if(id.startsWith("s")&&id.length===2){
    const i=+id.slice(1),st=S.sec[i];
    sectionDyn(i);
    $("#ta").oninput=e=>{
      st.text=e.target.value;
      if(st.status==="pass"||st.status==="soft"){st.status="todo";st.review=null;}
      if(st.sensOk&&!scanSens(st.text).length)st.sensOk=false;
      save();clearTimeout(sectionDyn.t);sectionDyn.t=setTimeout(()=>sectionDyn(i),250);};
  }
  if(id==="pack"){
    on("#pack","onclick",doPack);
    on("#repack","onclick",()=>{if(busy)return;S.deck=null;S.scenes=null;S.score=null;S.verify={};save();doPack();});
    document.querySelectorAll("[data-narr]").forEach(t=>t.oninput=e=>{
      S.scenes[+t.dataset.narr].narration=e.target.value;S.score=null;save();
      $("#dur").innerHTML=durHtml();$("#next").disabled=narrChars()/RATE>10;
      const tb=$("#trimBox"),over=narrChars()/RATE>10;if(over!==!!tb.innerHTML.trim()){tb.innerHTML=trimHtml();const t=$("#trim");if(t)t.onclick=trimNarr;}});
    on("#trim","onclick",trimNarr);
    on("#next","onclick",()=>go(S.step+1));
  }
  if(id==="qc"){
    on("#qc","onclick",doQc);on("#reqc","onclick",doQc);
    on("#goFix","onclick",()=>go(2+S.score.goBack));
    on("#next","onclick",()=>go(S.step+1));
  }
  if(id==="ship"){
    on("#dlDocx","onclick",dlDocx);
    const TXT={source:sourceText,video:nlmPrompt,slide:slidePrompt},NAME={source:"教材原稿",video:"影片提示詞",slide:"講義提示詞"};
    document.querySelectorAll("[data-copy]").forEach(btn=>btn.onclick=async()=>{
      const k=btn.dataset.copy;
      try{await navigator.clipboard.writeText(TXT[k]());btn.textContent="已複製"+NAME[k];setTimeout(()=>btn.textContent=(k==="source"?"複製教材原稿":"複製"+NAME[k]),2000);}
      catch(e){$("#copyMsg").textContent="無法自動複製，請改用下載的 Word 檔，或手動選取提示詞文字。";}});
    document.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>{S.route=b.dataset.route;save();render();});
    document.querySelectorAll("[data-v]").forEach(c=>c.onchange=()=>{S.verify[c.dataset.v]=c.checked;save();
      const done=verifyItems().every(x=>S.verify[x.id]);const sb=$("#submitBox");
      sb.classList.toggle("locked",!done);sb.setAttribute("aria-hidden",String(!done));
      sb.querySelector(".msg").className="msg "+(done?"ok":"info");});
  }
}
/* ============================================================
   AI 動作
   ============================================================ */
async function checkTopic(){
  const T=S.topic;
  if(!T.module||!T.official||chars(T.title)<6){$("#tmsg").innerHTML=`<div class="msg warn">請先選模組、官方主題，並寫下主題。</div>`;return;}
  $("#tmsg").innerHTML=`<div class="msg info"><span class="thinking">品檢員正在看題目</span></div>`;
  const prompt=`${BASE_RULES}
任務：檢查同仁自訂的教材主題是否合適。
所屬模組：${T.module} ${MODULES[T.module].name}
官方主題：${T.official}
同仁自訂主題：${T.title}
同仁單位：${me()?me()[1]:S.unit}
判斷標準：1) 與所選模組及官方主題相關；2) 夠聚焦，10 分鐘影片講得完（太大的題目如「倉儲管理」不行）；3) 是可以用現場實務經驗教的題目。標準寬鬆，大致符合就算通過。
只回覆 JSON：{"ok":true或false,"feedback":"40字內，說明理由","suggestion":"若不通過，給一個更聚焦的主題寫法；通過則空字串"}`;
  try{const r=await askJSON(prompt,"quick");S.topic.feedback={ok:!!r.ok,feedback:String(r.feedback||""),suggestion:String(r.suggestion||"")};save();render();}
  catch(e){$("#tmsg").innerHTML=`<div class="msg warn">${esc(aiErr(e))}</div>`;}
}

async function reviewSection(i){
  const s=SECTIONS[i],st=S.sec[i];
  st.review={pending:true};sectionDyn(i);
  const prev=st.rounds>0?`\n這是第 ${st.rounds+1} 次送檢，同仁已依上次追問補充。若已補上關鍵缺口就讓它通過，不要一直挑新毛病。`:"";
  const prompt=`${BASE_RULES}
任務：檢查同仁寫的教材段落「${s.title}」是否達標。
教材主題：${topicLine()}
本段要回答的問題：${s.q}
通過標準：${s.criteria}${prev}
同仁的回答：
"""
${st.text.slice(0,6000)}
"""
規則：
- 只判斷與提問，不要替同仁改寫、不要補上同仁沒寫的內容。
- 標準不要過嚴：達到通過標準就通過，用字粗糙、口語都沒關係。
- 不通過時，只問「一個」最關鍵的追問，具體到同仁看了就知道要補什麼。
只回覆 JSON：{"pass":true或false,"feedback":"50字內，先一句肯定寫得好的地方，不通過時再說缺什麼","question":"不通過時的一個追問；通過則空字串"}`;
  try{
    const r=await askJSON(prompt,"quick");
    st.rounds++;
    st.review={pass:!!r.pass,feedback:String(r.feedback||""),question:String(r.question||"")};
    if(r.pass)st.status="pass";
  }catch(e){st.review={err:aiErr(e)};}
  save();
  if(STATIONS[S.step].id==="s"+i)sectionDyn(i);
}

function sectionDump(){return SECTIONS.map((s,i)=>`【${i+1}. ${s.title}】\n${S.sec[i].text.trim()}`).join("\n\n");}
function speaker(){const p=me();return {name:p?p[0]:S.name,unit:p?p[1]:S.unit};}

let waitT=null;
function startWait(){const t0=Date.now();clearInterval(waitT);waitT=setInterval(()=>{const el=$("#waitSec");if(el)el.textContent=Math.round((Date.now()-t0)/1000);},1000);}
function stopWait(){clearInterval(waitT);}
async function doPack(){
  if(aiOff){localPack();save();render();return;}
  const sp=speaker();
  const SRC=`教材主題：${topicLine()}
講者：${sp.unit} ${sp.name}

同仁原始內容：
"""
${sectionDump().slice(0,20000)}
"""

最重要的規則：只能使用原始內容裡的資訊。可以重新排列、精簡、修順語句、合併重複，但不可以新增原文沒有的步驟、數字、法規、案例細節或建議。原文沒寫的就不要寫。`;
  busy="pack";startWait();
  try{
    if(!S.deck){
      packStage="第 1／2 步：整理講義重點";render();
      const r=await sample.json(`${BASE_RULES}
任務：把同仁寫的五段內容整理成教學講義。
${SRC}
講義規則：
- objectives：2–3 條學習目標，格式「學完後你能……」。
- slides：剛好 5 頁，依序對應情境痛點、知識拆解、實務案例、常見誤區、自我檢核表。heading 是該頁標題（具體，不要只寫段落名稱）；bullets 3–6 條，每條 30 字內。知識拆解保留步驟順序；自我檢核表保留每一項檢查項目原意。
- summary：3 條重點摘要，每條 30 字內。
只回覆 JSON：{"title":"講義標題","objectives":["…"],"slides":[{"heading":"…","bullets":["…"]}],"summary":["…"]}`,{modelTier:"default",cache:false});
      if(!r||!Array.isArray(r.slides))throw {code:"invalid_json"};
      S.deck={title:String(r.title||S.topic.title),objectives:(r.objectives||[]).map(String).slice(0,3),
        slides:r.slides.slice(0,5).map(x=>({heading:String(x.heading||""),bullets:(x.bullets||[]).map(String).slice(0,6)})),
        summary:(r.summary||[]).map(String).slice(0,3)};
      save();
    }
    packStage="第 2／2 步：寫影片分鏡";render();
    const r2=await sample.json(`${BASE_RULES}
任務：把同仁寫的五段內容整理成影片稿。這份稿會交給 AI 影片工具 NotebookLM 或 FlexClip 生成影片，不是本人錄影。
${SRC}
影片稿規則：
- scenes 剛好 7 個，依序：開場、情境痛點、知識拆解、實務案例、常見誤區、自我檢核表、結尾。
- scene：場景名稱。visual：畫面建議，一句話，描述適合放的圖、流程圖或現場照片類型（不要指名真實客戶標誌）。
- narration：逐字旁白，繁體中文口語，像資深同事帶新人；開場用「大家好，我是${sp.unit}的${sp.name}，今天要跟大家分享${S.topic.title}」；結尾提醒新人用檢核表自我確認。
- keypoints：該場景 1–3 個「必講重點」，每個 20 字內，是影片絕對不能漏講或講錯的內容。開場與結尾給空陣列。
- 7 個場景旁白合計 1,200–1,800 字，寧可短不要長。
只回覆 JSON：{"scenes":[{"scene":"…","visual":"…","narration":"…","keypoints":["…"]}]}`,{modelTier:"default",cache:false});
    const arr=Array.isArray(r2)?r2:r2&&r2.scenes;
    if(!Array.isArray(arr)||!arr.length)throw {code:"invalid_json"};
    S.scenes=arr.slice(0,9).map(x=>({scene:String(x.scene||""),visual:String(x.visual||""),narration:String(x.narration||""),keypoints:(x.keypoints||[]).map(String).slice(0,3)}));
    S.score=null;S.verify={};
    busy=null;stopWait();save();render();
  }catch(e){
    busy=null;stopWait();save();render();
    if(aiOff){localPack();save();render();return;}
    $("#packMsg").innerHTML=`<div class="msg warn">${esc(e&&e.code==="invalid_json"?"AI 這次回傳的內容不完整，請按上方按鈕再試一次（已完成的部分會保留）。":aiErr(e))}</div>`;
  }
}
async function trimNarr(){
  const b=$("#trim");if(b){b.disabled=true;b.textContent="精簡中…";}
  const target=Math.round(RATE*9);
  try{
    const r=await sample.json(`${BASE_RULES}
任務：把下列影片旁白精簡到合計 ${target} 字以內，保留每個場景的必講重點與原意，不新增內容，口語自然。場景數量與順序不變。
${JSON.stringify(S.scenes.map(x=>({scene:x.scene,keypoints:x.keypoints,narration:x.narration})))}
只回覆 JSON：{"narrations":["場景1旁白","場景2旁白",…]}`,{modelTier:"default",cache:false});
    const n=r&&r.narrations;
    if(!Array.isArray(n)||n.length!==S.scenes.length)throw {code:"invalid_json"};
    n.forEach((t,k)=>S.scenes[k].narration=String(t));S.score=null;save();render();
  }catch(e){if(b){b.disabled=false;b.textContent="請 AI 精簡旁白";}
    $("#trimBox").insertAdjacentHTML("beforeend",`<div class="msg warn">${esc(e&&e.code==="invalid_json"?"精簡失敗，請再按一次，或自己刪減上方旁白。":aiErr(e))}</div>`);}
}
function localPack(){
  const cut=t=>t.length>60?t.slice(0,59)+"…":t;
  const pieces=i=>{let ls=lines(S.sec[i].text);if(ls.length<3)ls=S.sec[i].text.split(/[。！？\n]/).map(x=>x.trim()).filter(Boolean);return ls.slice(0,6).map(cut);};
  S.deck={title:S.topic.title,objectives:[`學完後你能說出${S.topic.title}的關鍵步驟`,"學完後你能避開常見錯誤，並用檢核表自我確認"],
    slides:SECTIONS.map((s,i)=>({heading:s.title,bullets:pieces(i)})),summary:lines(S.sec[4].text).slice(0,3).map(cut)};
  const sp=speaker();
  const VIS=["現場作業照片或示意圖","步驟流程圖","案例前後對照圖","錯誤做法與正確做法對照","檢核表畫面"];
  S.scenes=[{scene:"開場",visual:"主題標題與講者單位",narration:`大家好，我是${sp.unit}的${sp.name}，今天要跟大家分享${S.topic.title}。`,keypoints:[]},
    ...SECTIONS.map((s,i)=>({scene:s.title,visual:VIS[i],narration:S.sec[i].text.trim(),keypoints:lines(S.sec[i].text).slice(0,2).map(t=>t.length>20?t.slice(0,19)+"…":t)})),
    {scene:"結尾",visual:"謝謝收看",narration:"最後，請大家用這份檢核表自我確認，有問題隨時找我。謝謝大家。",keypoints:[]}];
  S.verify={};
}

async function doQc(){
  busy="qc";S.score=null;render();
  const prompt=`${BASE_RULES}
任務：依 FDB 認證評分標準，預估這份教材的分數（滿分 100，70 分通過）。
評分項目與配分：
- 主題契合度 15：教材對應正確模組，內容無跑題
- 教材完整性 20：有學習目標、教學步驟、重點摘要
- 內容正確度 20：SOP、流程步驟、數字、法規無誤（以內部一致性、邏輯合理判斷）
- 影片品質 15：影片尚未製作，以影片稿分鏡是否完整、每場景有畫面建議、旁白長度是否在 10 分鐘內估計
- 實務性 15：案例或情境來自現場真實狀況
- 自學可用性 15：學習者不需額外說明就能看懂
評分偏向鼓勵：內容達到基本要求就給該項 70% 以上。
教材主題：${topicLine()}
教材原稿：
"""
${sourceText().slice(0,12000)}
"""
找出最弱的一項，給具體改善建議。goBack 是建議回去補強的段落編號：0 情境痛點、1 知識拆解、2 實務案例、3 常見誤區、4 自我檢核表；不需要回去就填 -1。
只回覆 JSON：{"scores":{"主題契合度":0,"教材完整性":0,"內容正確度":0,"影片品質":0,"實務性":0,"自學可用性":0},"advice":"60字內","goBack":-1}`;
  try{
    const r=await askJSON(prompt,"default");
    const sc={};let tot=0;CRIT.forEach(([k,max])=>{const v=Math.max(0,Math.min(max,Math.round(+(r.scores?.[k]??0))));sc[k]=v;tot+=v;});
    S.score={scores:sc,total:tot,advice:String(r.advice||""),goBack:Number.isInteger(+r.goBack)?+r.goBack:-1};
    busy=null;save();render();
  }catch(e){busy=null;render();$(".card").insertAdjacentHTML("beforeend",`<div class="msg warn">${esc(aiErr(e))}</div>`);}
}

async function saveFile(filename,data){
  const m=$("#dlMsg");
  if(!downloads){m.innerHTML=`<div class="msg warn">這個畫面無法下載檔案。請用「複製教材原稿」貼到 Word 保存。</div>`;return;}
  try{await downloads.save({filename,data});m.innerHTML=`<div class="msg ok">已下載：${esc(filename)}</div>`;}
  catch(e){m.innerHTML=`<div class="msg warn">${e.code==="declined"?"你取消了下載。":"下載失敗，請再試一次。"}</div>`;}
}
async function dlDocx(){
  if(typeof docx==="undefined"){$("#dlMsg").innerHTML=`<div class="msg warn">文件元件沒有載入，請重新整理頁面再試。</div>`;return;}
  const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,HeadingLevel,ShadingType}=docx;
  const F="Microsoft JhengHei",sp=speaker();
  const P=(t,o={})=>new Paragraph({spacing:{after:80},children:[new TextRun({text:t,font:F,size:o.size||22,bold:!!o.bold,color:o.color})]});
  const cell=(kids,w,shade)=>new TableCell({width:{size:w,type:WidthType.PERCENTAGE},shading:shade?{type:ShadingType.CLEAR,fill:shade,color:"auto"}:undefined,
    margins:{top:80,bottom:80,left:120,right:120},children:kids});
  const rows=[new TableRow({tableHeader:true,children:[cell([P("場景",{bold:true})],14,"EADBC0"),cell([P("畫面建議",{bold:true})],20,"EADBC0"),cell([P("旁白（逐字）",{bold:true})],46,"EADBC0"),cell([P("必講重點",{bold:true})],20,"EADBC0")]}),
    ...(S.scenes||[]).map((x,k)=>new TableRow({children:[cell([P(`${k+1}. ${x.scene}`,{bold:true})],14),cell([P(x.visual,{size:20})],20),
      cell(x.narration.split(/\n+/).filter(Boolean).map(t=>P(t)),46),cell(x.keypoints.length?x.keypoints.map(t=>P("☐ "+t,{size:20})):[P("—",{size:20})],20)]}))];
  const doc=new Document({sections:[{properties:{page:{margin:{top:900,bottom:900,left:900,right:900}}},children:[
    P("FDB 教材原稿",{size:36,bold:true}),
    P(`主題：${S.topic.title}`),P(`模組：${topicLine()}`),P(`講者：${sp.unit} ${sp.name}`),
    P(`旁白共 ${narrChars()} 字，預估 ${Math.round(narrChars()/RATE*10)/10} 分鐘`,{color:"56636A",size:20}),
    P(""),
    P("第一部分：講義重點",{size:28,bold:true}),
    P("學習目標",{bold:true}),...(S.deck?.objectives||[]).map(o=>P("・"+o)),
    ...(S.deck?.slides||[]).flatMap((x,k)=>[P(""),P(`${k+1}. ${SECTIONS[k]?.title||""}：${x.heading}`,{bold:true}),...x.bullets.map(t=>P("・"+t))]),
    P(""),P("重點摘要",{bold:true}),...(S.deck?.summary||[]).map(o=>P("・"+o)),
    P(""),
    P("第二部分：影片分鏡",{size:28,bold:true}),
    new Table({width:{size:100,type:WidthType.PERCENTAGE},rows}),
    P(""),
    P("NotebookLM 講義提示詞",{bold:true}),
    ...slidePrompt().split("\n").map(t=>P(t,{size:20})),
    P(""),
    P("NotebookLM 影片提示詞",{bold:true}),
    ...nlmPrompt().split("\n").map(t=>P(t,{size:20}))
  ]}]});
  try{const blob=await Packer.toBlob(doc);await saveFile(fileBase()+"_教材原稿.docx",blob);}
  catch(e){$("#dlMsg").innerHTML=`<div class="msg warn">原稿產生失敗，請重新整理頁面再試。</div>`;}
}
